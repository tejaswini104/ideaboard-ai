services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ideaboard
      POSTGRES_USER: ideaboard
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ideaboard:local-dev-only-change-me@db:5432/ideaboard
      CORS_ORIGINS: "*"
    depends_on: [db]
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    image: ideaboard-ai-frontend:latest
    depends_on: [backend]
    ports: ["80:80"]
    restart: unless-stopped
volumes:
  postgres_data:
