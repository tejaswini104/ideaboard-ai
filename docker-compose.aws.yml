services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ideaboard
      POSTGRES_USER: ideaboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaboard -d ideaboard"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ideaboard:${POSTGRES_PASSWORD}@db:5432/ideaboard
      CORS_ORIGINS: http://localhost
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
volumes:
  postgres_data:
